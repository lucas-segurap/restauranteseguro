
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Restaurante Seguro</title>

    <meta name="description"
          content="Cadastre-se no Restaurante Seguro.">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>

<body>

<main class="cadastro-container">

    <section class="cadastro-card">

        <header class="cadastro-header">

            <span class="brand-icon">RS</span>

            <h1>Restaurante <strong>Seguro</strong></h1>

            <p>Crie sua conta e aproveite nossos serviços.</p>

        </header>

        <div class="cadastro-heading">
            <h2>Criar minha conta</h2>
            <p>Preencha seus dados para realizar o cadastro.</p>
        </div>

        <!-- Mensagens -->
        <div th:if="${sucesso}"
             class="alert alert-success"
             th:text="${sucesso}">
        </div>

        <div th:if="${erro}"
             class="alert alert-danger"
             th:text="${erro}">
        </div>

        <!-- Formulário -->
        <form th:action="@{/clientes/cadastrar}"
              th:object="${cliente}"
              method="post">

            <div class="row">

                <div class="col-12 form-group">
                    <label for="nome">Nome completo</label>

                    <input type="text"
                           id="nome"
                           th:field="*{nome}"
                           class="form-control"
                           maxlength="80"
                           placeholder="Digite seu nome completo"
                           required>
                </div>

                <div class="col-md-6 form-group">
                    <label for="cpf">CPF</label>

                    <input type="text"
                           id="cpf"
                           th:field="*{cpf}"
                           class="form-control"
                           maxlength="14"
                           placeholder="000.000.000-00"
                           required>
                </div>

                <div class="col-md-6 form-group">
                    <label for="telefone">Telefone</label>

                    <input type="tel"
                           id="telefone"
                           th:field="*{telefone}"
                           class="form-control"
                           maxlength="25"
                           placeholder="(00) 00000-0000"
                           required>
                </div>

                <div class="col-12 form-group">
                    <label for="email">E-mail</label>

                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           class="form-control"
                           maxlength="50"
                           placeholder="seuemail@exemplo.com"
                           required>
                </div>

                <div class="col-md-6 form-group">
                    <label for="dataNascimento">Data de nascimento</label>

                    <input type="date"
                           id="dataNascimento"
                           th:field="*{dataNascimento}"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6 form-group">
                    <label for="senha">Senha</label>

                    <input type="password"
                           id="senha"
                           th:field="*{senha}"
                           class="form-control"
                           minlength="8"
                           maxlength="72"
                           placeholder="Mínimo de 8 caracteres"
                           required>
                </div>

                <div class="col-12 form-group">
                    <label for="endereco">Endereço</label>

                    <input type="text"
                           id="endereco"
                           th:field="*{endereco}"
                           class="form-control"
                           maxlength="100"
                           placeholder="Rua, avenida e número"
                           required>
                </div>

                <div class="col-md-6 form-group">
                    <label for="bairro">Bairro</label>

                    <input type="text"
                           id="bairro"
                           th:field="*{bairro}"
                           class="form-control"
                           maxlength="50"
                           placeholder="Seu bairro"
                           required>
                </div>

                <div class="col-md-6 form-group">
                    <label for="cidade">Cidade</label>

                    <input type="text"
                           id="cidade"
                           th:field="*{cidade}"
                           class="form-control"
                           maxlength="50"
                           placeholder="Sua cidade"
                           required>
                </div>

            </div>

            <button type="submit" class="btn-cadastrar">
                Criar minha conta
            </button>

        </form>

        <footer class="cadastro-footer">

            <p>
                Já possui uma conta?
                <a th:href="@{/login}">Entrar</a>
            </p>

            <a th:href="@{/}" class="back-home">
                Voltar para a página inicial
            </a>

        </footer>

    </section>

    <footer class="copyright">
        © 2026 Restaurante Seguro. Todos os direitos reservados.
    </footer>

</main>

</body>
</html>
