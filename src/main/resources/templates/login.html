
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Restaurante Seguro</title>

    <meta name="description"
          content="Acesse sua conta no Restaurante Seguro.">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<main class="login-container">

    <section class="login-card">

        <div class="login-brand">
            <span class="brand-icon">RS</span>

            <h1>Restaurante <strong>Seguro</strong></h1>

            <p>Bem-vindo de volta!</p>
        </div>

        <div class="login-heading">
            <h2>Entrar na sua conta</h2>
            <p>Informe seus dados para continuar.</p>
        </div>

        <!-- Mensagem de erro -->
        <div th:if="${erro}"
             class="alert alert-danger"
             role="alert"
             th:text="${erro}">
        </div>

        <!-- Formulário -->
        <form th:action="@{/login}" method="post">

            <div class="form-group">

                <label for="email">E-mail</label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required>

            </div>

            <div class="form-group">

                <label for="senha">Senha</label>

                <input
                        type="password"
                        id="senha"
                        name="senha"
                        class="form-control"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required>

            </div>

            <button type="submit" class="btn-login">
                Entrar
            </button>

        </form>

        <div class="login-footer">

            <p>
                Ainda não possui uma conta?
                <a th:href="@{/clientes/cadastro}">
                    Cadastre-se
                </a>
            </p>

            <a th:href="@{/}" class="back-home">
                Voltar para a página inicial
            </a>

        </div>

    </section>

    <footer class="login-copyright">
        © 2026 Restaurante Seguro. Todos os direitos reservados.
    </footer>

</main>

</body>
</html>
